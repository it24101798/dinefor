# DineFor homepage hero media upload support
# Merge these directives into the HTTPS server block that serves api.dinefor.com.
# Do NOT replace your whole nginx configuration with this file.

# Allows the admin CMS to submit source hero videos up to the app's 500 MB limit.
client_max_body_size 550M;

# Recommended inside the existing /api/ proxy location when large uploads traverse it:
# proxy_request_buffering off;
# proxy_connect_timeout 60s;
# proxy_send_timeout 600s;
# proxy_read_timeout 600s;

# After editing production nginx:
#   sudo nginx -t
#   sudo systemctl reload nginx
